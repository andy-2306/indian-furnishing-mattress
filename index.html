<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Furnishing & Mattress</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --btn-glass: rgba(255, 255, 255, 0.2);
            --accent-gold: #D4AF37;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)), 
                        url('https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 400px;
            width: 100%;
            margin-top: 2vh;
        }

        /* Language Switcher */
        .lang-switcher {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            cursor: pointer;
            padding: 5px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }
        
        .lang-btn.active {
            background: rgba(255, 255, 255, 0.3);
            font-weight: 600;
        }

        /* Glassmorphism Main Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .logo-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: white; 
            padding: 5px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            object-fit: contain;
        }
        
        h1 { 
            font-family: 'Playfair Display', serif;
            font-size: 26px; 
            margin: 0 0 5px 0; 
            line-height: 1.2;
        }
        
        p#slogan { 
            font-size: 13px; 
            font-style: italic; 
            color: #d1d1d1;
            margin: 0 0 25px 0; 
        }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--btn-glass);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        .btn:hover { background: rgba(255, 255, 255, 0.3); }
        .btn-google { border-left: 4px solid #4285F4; }
        .btn-insta { border-left: 4px solid #E1306C; }
        .btn-web { border-left: 4px solid var(--accent-gold); } 

        .btn-icon-img {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* Review Card Popup */
        #review-card {
            display: none;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            margin-top: 20px;
            animation: slideUp 0.4s ease-out;
            text-align: left;
        }

        #review-card p { font-weight: 500; margin-top: 0; font-size: 14px; }
        .sub-prompt { font-size: 12px !important; color: #d1d1d1; margin-bottom: 12px !important; }

        /* Multi-Select Tags Styling */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tag-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 8px 14px;
            color: white;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .tag-btn:hover { background: rgba(255,255,255,0.2); }
        
        .tag-btn.active-tag {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #111;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Review Text Area & Actions */
        #review-action-area {
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: #333;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
            background-color: rgba(255,255,255,0.95);
            line-height: 1.5;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-refresh, .btn-copy {
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-refresh {
            background: rgba(255,255,255,0.2);
            color: white;
            flex: 1;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-refresh:hover { background: rgba(255,255,255,0.3); }

        .btn-copy { 
            background-color: var(--accent-gold); 
            color: #111; 
            flex: 2;
        }

        @keyframes slideUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>

                        "गद्दों की क्वालिटी बहुत बढ़िया है, नींद भी अच्छी आती है।",
                        "पीठ दर्द के लिए इनका मेमोरी फोम गद्दा सबसे अच्छा है।"
                    ],
                    pillows: [
                        "तकियों की क्वालिटी बहुत नरम और आरामदायक है।",
                        "गर्दन के दर्द से आराम के लिए इनके तकिए बहुत अच्छे हैं।",
                        "सही दाम में बेहतरीन और आरामदायक तकिए मिले।"
                    ],
                    vertical_blinds: [
                        "घर के लिए वर्टिकल ब्लाइंड्स लगवाए, डिज़ाइन बहुत ही मॉडर्न है।",
                        "वर्टिकल ब्लाइंड्स की फिटिंग बहुत सफाई से और जल्दी की गई।",
                        "ऑफिस के लिए इनके वर्टिकल ब्लाइंड्स सबसे बेहतरीन विकल्प हैं।"
                    ],
                    other: [
                        "इंडियन फर्निशिंग की कस्टमर सर्विस बहुत अच्छी और मददगार है।",
                        "स्टाफ का व्यवहार बहुत अच्छा है और वे सही सलाह देते हैं।",
                        "घर सजाने के सामान के लिए मैं सबको यहीं आने की सलाह दूँगा।"
                    ]
                }
            }
        };

        const productKeys = ['blinds', 'carpets', 'curtains', 'fabrics', 'mattresses', 'pillows', 'vertical_blinds', 'other'];
        let currentLang = 'mr'; 
        let selectedProducts = []; // Array to store multiple selections

        function initApp() {
            setLanguage('mr');
        }

        function setLanguage(lang) {
            currentLang = lang;
            
            // Update Active Button UI
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');

            // Update Text Elements
            document.getElementById('slogan').innerText = data[lang].slogan;
            document.getElementById('txt-google').innerText = data[lang].google;
            document.getElementById('txt-insta').innerText = data[lang].insta;
            document.getElementById('txt-web').innerText = data[lang].web;
            document.getElementById('txt-prompt').innerText = data[lang].prompt;
            document.getElementById('txt-sub-prompt').innerText = data[lang].subPrompt;
            document.getElementById('txt-copy').innerText = data[lang].copyBtn;
            document.getElementById('txt-refresh').innerText = data[lang].refreshBtn;
            
            // Reset Copy Button styling
            const copyBtn = document.getElementById('copy-btn');
            copyBtn.style.backgroundColor = "#D4AF37";

            // Redraw tags in the new language
            renderTags();

            // If tags are already selected, regenerate the review in the new language instantly
            if (selectedProducts.length > 0) {
                generateReview();
            }
        }

        function renderTags() {
            const container = document.getElementById('tags-container');
            container.innerHTML = '';
            
            productKeys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'tag-btn ' + (selectedProducts.includes(key) ? 'active-tag' : '');
                btn.innerText = data[currentLang].products[key];
                
                // Add click listener to toggle the tag
                btn.onclick = () => toggleTag(key);
                
                container.appendChild(btn);
            });
        }

        function toggleTag(key) {
            const index = selectedProducts.indexOf(key);
            
            // If already selected, remove it. If not, add it.
            if (index > -1) {
                selectedProducts.splice(index, 1);
            } else {
                selectedProducts.push(key);
            }
            
            renderTags(); // Re-render to show active/inactive state visually
            
            // Show or hide the text area based on selection
            if (selectedProducts.length > 0) {
                document.getElementById('review-action-area').style.display = 'block';
                generateReview();
            } else {
                document.getElementById('review-action-area').style.display = 'none';
            }
        }

        function triggerReviewCard() {
            document.getElementById('review-card').style.display = 'block';
            setTimeout(() => {
                document.getElementById('review-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function generateReview() {
            if(selectedProducts.length === 0) return;
            
            let combinedReview = [];
            
            // Loop through every selected product and pick a random sentence for it
            selectedProducts.forEach(key => {
                const sentenceVariations = data[currentLang].reviews[key];
                const randomIndex = Math.floor(Math.random() * sentenceVariations.length);
                combinedReview.push(sentenceVariations[randomIndex]);
            });
            
            // Join all the random sentences together into one fluid paragraph
            document.getElementById('review-text').value = combinedReview.join(' ');
            
            // Reset the copy button just in case they clicked refresh after copying
            document.getElementById('copy-btn').style.backgroundColor = "#D4AF37";
            document.getElementById('txt-copy').innerText = data[currentLang].copyBtn;
        }

        function copyAndRedirect() {
            const copyText = document.getElementById("review-text");
            copyText.select();
            copyText.setSelectionRange(0, 99999); 
            
            navigator.clipboard.writeText(copyText.value).then(() => {
                const copyBtn = document.getElementById("copy-btn");
                document.getElementById('txt-copy').innerText = data[currentLang].copiedMsg;
                copyBtn.style.backgroundColor = "#20c997"; 
                
                setTimeout(() => {
                    window.location.href = 'https://search.google.com/local/writereview?placeid=ChIJNfZ__w655zsRss9lwLQ40zA';
                }, 1500);
            });
        }
    </script>
